general:
  experiment: unet_exp35_1x1_hybrid
  model_type: unet_exp35
  loss_type: bernoulli_gamma
  variable: precip
  target: mswep
  src: era5
  interpolation_type: linear
  variables:
  - z
  - q
  - t
  - u
  - v
  levels:
  - 500
  - 700
  - 850
  - 1000
  resolution: 2.0
  verbose: true
region:
  lon_min: -18
  lon_max: 0
  lat_min: 21
  lat_max: 37
paths:
  lmdz_predictor_pattern: '{folder}/{lmdz_var}-hist.nc'
  root_dir: /srv/lustre01/project/climat-um6p-st-iwri-7ksifkvwkuy/users/mohammad.elaabaribao/data/reanalysis/era5
  era5_predictor_pattern: '{var}_1979-2020_levels.nc'
  mswep_path: /srv/lustre01/project/climat-um6p-st-iwri-7ksifkvwkuy/users/mohammad.elaabaribao/data/obs/mswep/mswep_1979_2020.nc
  shapefile_path: /srv/lustre01/project/climat-um6p-st-iwri-7ksifkvwkuy/users/mohammad.elaabaribao/data/shapefiles/Morocco_shpfile/DA_REGIONS_12R.shp
mappings:
  lmdz_var_map:
    z: geop
    q: rhum
    u: vitu
    v: vitv
    t: temp
training:
  learning_rate: 1e-4
  epochs: 200
  batch_size: 64
  loss_type: bernoulli_gamma
  norm_mode: gridbox
  early_stopping:
    enable: true
    max: 15
  LR_scheduler:
    enable: false
    patience: 5
    factor: 0.5
    min_lr: 1e-6
  gradient_clipping:
    enable: true
    value: 1.0
  weight_decay:
    enable: true
    value: 1e-5
  optimizer: adamw
  dropout:
    enable: true
    value: 0.2
  scheduler:
    enable: true
    type: cosine
  group_norm:
    enable: true
    num_groups: 32
  validation:
    enable: true
    pecentage: 0.2
dates:
  train:
    start: '1979-01-01'
    end: '2005-12-31'
  test:
    start: '2006-01-01'
    end: '2020-12-31'
prediction:
  train_config_path: /srv/data/mohammad.elaabaribao/work/papers/downscaling/main/results/unet/retained/unet_exp35_1x1_hybrid/region_lat_21.0_37.0_lon_-18.0_0.0/train_1979_01_01_2005_12_31/test_2006_01_01_2020_12_31/gridbox_0.0001_bernoulli_gamma_200ep_wd_gc_dropout_cosine_gn/config.txt
  model_path: /srv/data/mohammad.elaabaribao/work/papers/downscaling/main/results/unet/retained/unet_exp35_1x1_hybrid/region_lat_21.0_37.0_lon_-18.0_0.0/train_1979_01_01_2005_12_31/test_2006_01_01_2020_12_31/gridbox_0.0001_bernoulli_gamma_200ep_wd_gc_dropout_cosine_gn/models/unet_exp35_precip.pth
  bc_reference_folder: /home/mohammad.elaabaribao/lustre/climat-um6p-st-iwri-7ksifkvwkuy/shared/TEAM/data/lmdz/r250/amip/present/all_Mor
  models_dir: /srv/data/mohammad.elaabaribao/work/papers/downscaling/main/results/unet/retained/
  output_dir: results/1979_2014/unet_exp35_1x1_hybrid
  scenarios:
  - name: era5_present
    enable: false
    src: era5
    start: '1979-01-01'
    end: '2014-12-31'
    bias_correction: false
    folder: /home/mohammad.elaabaribao/lustre/climat-um6p-st-iwri-7ksifkvwkuy/users/mohammad.elaabaribao/data/era5ztquv/1979_2020/all_data
  - name: lmdz_35_present
    enable: false
    src: lmdz
    start: '1979-01-01'
    end: '2014-12-31'
    bias_correction: true
    folder: /home/mohammad.elaabaribao/lustre/climat-um6p-st-iwri-7ksifkvwkuy/shared/TEAM/data/lmdz/r35/hist/present/all_Mor
    bc_reference_folder: /home/mohammad.elaabaribao/lustre/climat-um6p-st-iwri-7ksifkvwkuy/shared/TEAM/data/lmdz/r35/hist/present/all_Mor
  - name: lmdz_250_present
    enable: true
    src: lmdz
    start: '1979-01-01'
    end: '2014-12-31'
    bias_correction: true
    folder: /home/mohammad.elaabaribao/lustre/climat-um6p-st-iwri-7ksifkvwkuy/shared/TEAM/data/lmdz/r250/amip/present/all_Mor
