general:
  experiment: vit_exp2
  model_type: vit
  loss_type: bernoulli_gamma
  variable: precip
  target: mswep
  src: era5
  interpolation_type: linear
  variables: ['z', 'q', 't', 'u', 'v']
  levels: [500, 700, 850, 1000]
  resolution: 2.0
  verbose: true
training:
  learning_rate: 1e-3
  epochs: 100
  batch_size: 64
  loss_type: bernoulli_gamma
  norm_mode: gridbox
  early_stopping: {enable: true, max: 15}
  weight_decay: {enable: true, value: 1e-4}
  optimizer: adamw
mappings:
  lmdz_var_map: {z: geop, q: rhum, u: vitu, v: vitv, t: temp}
region:
  lon_min: -18
  lon_max: 0
  lat_min: 21
  lat_max: 37
dates:
  train: {start: '1980-01-01', end: '2005-12-31'}
  test: {start: '2006-01-01', end: '2020-12-31'}
  reference: {start: '1979-01-01', end: '2005-12-31'}
