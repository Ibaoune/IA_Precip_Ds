general:
  experiment: cnn_test_inference
  model_type: cnn
  loss_type: bernoulli_gamma
  variable: precip
  target: mswep
  src: era5
  interpolation_type: linear
  variables:
  - z
  - q
  - t
  - u
  - v
  levels:
  - 500
  - 700
  - 850
  - 1000
  resolution: 2.0
  verbose: true
training:
  learning_rate: 1e-3
  epochs: 100
  batch_size: 64
  loss_type: bernoulli_gamma
  norm_mode: gridbox
  early_stopping:
    enable: true
    max: 15
  LR_scheduler:
    enable: true
    patience: 5
    factor: 0.5
    min_lr: 1e-6
  gradient_clipping:
    enable: true
    value: 1.0
  weight_decay:
    enable: true
    value: 1e-4
  optimizer: adamw
  dropout:
    enable: true
    value: 0.1
  scheduler:
    enable: true
    type: cosine
  group_norm:
    enable: true
    num_groups: 32
  validation:
    enable: true
    pecentage: 0.2
mappings:
  lmdz_var_map:
    z: geop
    q: rhum
    u: vitu
    v: vitv
    t: temp
