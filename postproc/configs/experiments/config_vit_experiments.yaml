experiment: eval_vit_experiments
parameters:
  start_date: '2006-01-01'
  end_date: '2020-12-31'
  region: allmorr
  regions:
  - allmorr
  mask_land: true
  only_morocco: true
  predictand: pr
  plot_only: false
  impose_robust_limits: true
  show_title_metadata: true
  customize_colorbars: true
  plot_periods:
  - Annual
  - DJF
  - MAM
  - JJA
  - SON
reference:
  name: MSWEP
  file_path: /srv/data/mohammad.elaabaribao/work/papers/downscaling/lit_version/data/mswep_1979_2020.nc
  variable_name: precipitation
datasets:
- name: CNN_Base
  file_path: ../main/results/cnn/tests/cnn_exp3_lossmask_north/region_lat_21.0_37.0_lon_-18.0_0.0/train_1979_01_01_2005_12_31/test_2006_01_01_2020_12_31/gridbox_0.001_bernoulli_gamma_200ep_wd_gc_dropout_cosine_gn/output_data/cnn_predictions_era5_to_mswep.nc
  variable_name: precipitation
- name: ViT_Retained
  file_path: ../main/results/vit/tests/vit_precip_exp22_hybrid_deep_reg/region_lat_21.0_36.0_lon_-18.0_0.0/train_1979_01_01_2005_12_31/test_2006_01_01_2020_12_31/global_0.0005_bernoulli_gamma_30ep_lr_sched_wd_gc_dropout_cosine_gn/output_data/vit_predictions_era5_to_mswep.nc
  variable_name: precipitation
postproc:
  mean:
    enable: true
    bias: true
    rmse: true
    correlation: true
  extreme:
    enable: true
    cdd: true
    cdd_thresholds:
    - 1.0
    qqplot: false
    r01: false
    r99: false
    r95: true
    r99_freq: false
    r95_freq: true
    rocss: false
visualisation:
  model_colors:
    MSWEP: '#000000'
    CNN_Base: '#457B9D'
    ViT_Retained: '#E63946'
