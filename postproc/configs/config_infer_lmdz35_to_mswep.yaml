 MSWEP: "#000000"
 LMDZ35: "#E76F51"
 GLM: "#2A9D8F"
 CNN: "#457B9D"
 U-Net: "#1D3557"
 UNET: "#1D3557"
 ViT: "#E63946"
 VIT: "#E63946"
