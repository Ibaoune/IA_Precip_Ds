# Author: M. El Aabaribaoune (@um6p)
experiment: "inference_lmdz35_to_mswep"
parameters:
 start_date: "1979-01-01"
 end_date: "2014-12-31"
 region: "allmorr"
 regions:
 - "allmorr"
 mask_land: true
 only_morocco: true
 predictand: "pr"
 plot_only: false
 impose_robust_limits: true
 show_title_metadata: true
 customize_colorbars: true
 plot_periods:
 - Annual
 - DJF
 - MAM
 - JJA
 - SON

reference:
 name: mswep
 file_path: /home/mohammad.elaabaribao/lustre/climat-um6p-st-iwri-7ksifkvwkuy/users/mohammad.elaabaribao/data//era5ztquv/1979_2020/all_data/mswep_1979_2020.nc
 variable_name: precipitation

datasets:
- name: LMDZ35
 file_path: datasets/raw_lmdz35_10km.nc
 variable_name: precipitation
- name: GLM
 file_path: ../inference/results/1979_2014/glm_precip_l2/glm_lmdz_35_present_true.nc
 variable_name: precipitation
- name: CNN
 file_path: ../inference/results/1979_2014/cnn_exp5/cnn_lmdz_35_present_true.nc
 variable_name: precipitation
- name: UNET
 file_path: ../inference/results/1979_2014/cnn_exp3/cnn_lmdz_35_present_true.nc
 variable_name: precipitation
- name: ViT
 file_path: ../inference/results/1979_2014/vit_precip_exp21_best_hybrid/vit_lmdz_250_present_true.nc
 variable_name: precipitation

postproc:
 mean:
 enable: true
 bias: true
 rmse: true
 correlation: true
 extreme:
 enable: true
 cdd: true
 cdd_thresholds: [1.0, 0.5]
 qqplot: false
 r01: false
 r99: false
 r95: true
 r99_freq: false
 r95_freq: true
 rocss: false

visualisation:
