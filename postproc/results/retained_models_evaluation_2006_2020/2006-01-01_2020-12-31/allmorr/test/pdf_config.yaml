# =============================================================================
# PDF Generation Configuration
# =============================================================================
# This config controls which metrics, seasons, and experiments are included
# in the generated PDFs. One PDF is produced per metric.
#
# To add/remove items, simply comment out or add entries in the lists below.
# =============================================================================

# --- Output settings ---
output_dir: "pdf_output"           # Directory where PDFs will be saved (relative to this config)

# --- Base path to the experiment results ---
# Can be absolute or relative to where the script is run
base_path: "."   # Current directory (the test/ folder)

# --- Experiments to include ---
# Each experiment is a sub-path under the main results directory.
# For now we only have one experiment path, but you can add more.
experiments:
  - name: "allmorr_test"
    path: "."   # Relative to base_path

# --- Seasons (in the order they will appear in the PDF) ---
# "all" corresponds to Annual figures
# The PDF pages will follow this exact order for each metric.
seasons:
  - id: "all"      # folder name
    label: "Annual"
  - id: "DJF"
    label: "DJF (Winter)"
  - id: "JJA"
    label: "JJA (Summer)"
  - id: "MAM"
    label: "MAM (Spring)"
  - id: "SON"
    label: "SON (Autumn)"

# --- Metrics to generate PDFs for ---
# Each metric produces its own PDF file.
#
# Fields:
#   name      : display name (used in PDF title page)
#   folder    : folder name under the experiment path (e.g., bias, correlation, rmse)
#   subfolder : optional subfolder (for metrics like cdd which have cdd_1mm, cdd_0.5)
#   output_pdf: name of the output PDF file
#   enabled   : set to false to skip this metric
metrics:
  - name: "Bias"
    folder: "bias"
    subfolder: null
    output_pdf: "bias.pdf"
    enabled: true

  - name: "RMSE"
    folder: "rmse"
    subfolder: null
    output_pdf: "rmse.pdf"
    enabled: true

  - name: "Correlation"
    folder: "correlation"
    subfolder: null
    output_pdf: "correlation.pdf"
    enabled: true

  - name: "CDD (1mm threshold)"
    folder: "cdd"
    subfolder: "cdd_1mm"
    output_pdf: "cdd_1mm.pdf"
    enabled: true

  - name: "CDD (0.5mm threshold)"
    folder: "cdd"
    subfolder: "cdd_0.5"
    output_pdf: "cdd_0.5.pdf"
    enabled: true

  - name: "R95 (Heavy Precipitation)"
    folder: "r95"
    subfolder: null
    output_pdf: "r95.pdf"
    enabled: true

  - name: "R95 Number of Events Frequency"
    folder: "r95_nbEvents_freq"
    subfolder: null
    output_pdf: "r95_nbEvents_freq.pdf"
    enabled: true

# --- Extra sections to append at the end of each metric PDF ---
# These are additional figure sources that don't follow the metric/season structure.
# Set enabled: false to skip.
extra_sections:
  - name: "Seasonal Summary"
    folder: "seasonal_summary"
    # Glob pattern to find figures (relative to experiment path / folder)
    pattern: "*.png"
    enabled: true

  - name: "Regional Summary"
    folder: "regional_summary"
    # Glob pattern to find figures
    pattern: "*.png"
    enabled: true
