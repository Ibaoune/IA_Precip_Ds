general:
  verbose: true
  experiment: unet_exp32_parallel
  variable: precip
  target: mswep
  src: era5
  model_type: unet_exp32
  interpolation_type: linear
  variables:
  - z
  - q
  - t
  - u
  - v
  levels:
  - 500
  - 700
  - 850
  - 1000
  resolution: 2.0
training:
  learning_rate: 1e-4
  epochs: 200
  batch_size: 64
  loss_type: bernoulli_gamma
  norm_mode: gridbox
  early_stopping:
    enable: true
    max: 15
  LR_scheduler:
    enable: false
    patience: 5
    factor: 0.5
    min_lr: 1e-6
  gradient_clipping:
    enable: true
    value: 1.0
  weight_decay:
    enable: true
    value: 1e-5
  optimizer: adamw
  dropout:
    enable: true
    value: 0.2
  scheduler:
    enable: true
    type: cosine
  group_norm:
    enable: true
    num_groups: 32
  validation:
    enable: true
    pecentage: 0.2
model:
  vit:
    emb_size: 128
    patch_size: 4
    num_layers: 4
    num_heads: 4
    dropout: 0.0
region:
  lon_min: -18
  lon_max: 0
  lat_min: 21
  lat_max: 37
dates:
  train:
    start: '1979-01-01'
    end: '2005-12-31'
  test:
    start: '2006-01-01'
    end: '2020-12-31'
plots:
  eval:
    show_suffix_components_in_title: true
paths:
  root_dir: /srv/lustre01/project/climat-um6p-st-iwri-7ksifkvwkuy/users/mohammad.elaabaribao/data/reanalysis/era5
  results_dir: /srv/data/mohammad.elaabaribao/work/papers/downscaling/main/results/unet/tests/tests_advanced_arch/
  shapefile_path: /srv/lustre01/project/climat-um6p-st-iwri-7ksifkvwkuy/users/mohammad.elaabaribao/data/shapefiles/Morocco_shpfile/DA_REGIONS_12R.shp
  era5_predictor_pattern: /srv/lustre01/project/climat-um6p-st-iwri-7ksifkvwkuy/users/mohammad.elaabaribao/data/reanalysis/era5/{var}_1979-2020_levels.nc
  mswep_path: /srv/lustre01/project/climat-um6p-st-iwri-7ksifkvwkuy/users/mohammad.elaabaribao/data/obs/mswep/mswep_1979_2020.nc
