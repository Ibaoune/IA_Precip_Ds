# Author: M. El Aabaribaoune (@um6p)
###########################################################
# Script: training.py / train.py
# Description: Main configuration for deep learning downscaling.
# Input: ERA5 or LMDZ datasets (predictors), Precipitation or Temperature (targets).
# Output: Trained models (.pth) and losses saved in results/exp_name/.
###########################################################

general:
  verbose: true
  experiment: "cnn_precip_linear_wd"
  variable: "precip"  
  target: "mswep"    
  src: "era5"        
  model_type: "cnn" 
  interpolation_type: "linear" 
  variables: ["z", "q", "t", "u", "v"]
  levels: [500, 700, 850, 1000]
  resolution: 2.0

training:
  learning_rate: 1e-3
  epochs: 2
  batch_size: 64
  loss_type: "bernoulli_gamma"
  norm_mode: "gridbox"
  early_stopping:
    enable: true
    max: 15
  LR_scheduler:
    enable: false
    patience: 5
    factor: 0.5
    min_lr: 1e-6
  gradient_clipping:
    enable: false
    value: 1.0
  weight_decay:
    enable: true
    value: 1e-4
  optimizer: "adam"
  dropout:
    enable: false
    value: 0.1
  scheduler: 
    enable: false
    type: "cosine"
  group_norm:
    enable: false
    num_groups: 32
  validation:
    enable: true
    pecentage: 0.1
  
model:
  vit:
    emb_size: 128
    patch_size: 4
    num_layers: 4
    num_heads: 4
    dropout: 0.0
  unet:
    emb_size: 128
    patch_size: 4
    num_layers: 4
    num_heads: 4
    dropout: 0.0
  cnn:
    num_layers: 4
    dropout: 0.0

region:
  lon_min: -18
  lon_max: 0
  lat_min: 21
  lat_max: 37

dates:
  train:
    start: "1979-01-01"
    end: "1979-12-31"
  test:
    start: "2006-01-01"
    end: "2006-12-31"

plots:
  eval:
    show_suffix_components_in_title: true

paths:
  root_dir: "/home/mohammad.elaabaribao/lustre/climat-um6p-st-iwri-7ksifkvwkuy/users/mohammad.elaabaribao/data/era5ztquv/1979_2020/all_data"
  results_dir: "/srv/data/mohammad.elaabaribao/work/papers/downscaling/main/results/"
  shapefile_path: "/home/mohammad.elaabaribao/lustre/climat-um6p-st-iwri-7ksifkvwkuy/users/mohammad.elaabaribao/data/shapefiles/Morocco_shpfile/DA_REGIONS_12R.shp"
  era5_predictor_pattern: "{var}_1979-2020_levels.nc"
  mswep_path: "mswep_1979_2020.nc"
