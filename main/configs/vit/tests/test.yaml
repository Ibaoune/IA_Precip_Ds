# Author: M. El Aabaribaoune (@um6p)
###########################################################
# Script: training.py / train.py
# Description: Main configuration for deep learning downscaling.
# Input: ERA5 or LMDZ datasets (predictors), Precipitation or Temperature (targets).
# Output: Trained models (.pth) and losses saved in results/exp_name/.
###########################################################

general:
  verbose: true
  experiment: "vit_precip_linear"
  variable: "precip"  
  target: "mswep"    
  src: "era5"        
  model_type: "vit" 
  interpolation_type: "linear" 
  variables: ["z", "q", "t", "u", "v"]
  levels: [500, 700, 850]
  resolution: 2.0

training:
  learning_rate: 1e-3
  epochs: 2
  batch_size: 4
  loss_type: "bernoulli_gamma" 
  norm_mode: "gridbox"         
  early_stopping:
    enable: true
    max: 15
  LR_scheduler:
    enable: true
    patience: 5
    factor: 0.5
    min_lr: 1e-6
  gradient_clipping:
    enable: true
    value: 1.0
  weight_decay:
    enable: true
    value: 1e-4
  optimizer: "adamw"
  dropout:
    enable: true
    value: 0.1
  scheduler: 
    enable: true
    type: "cosine"
  group_norm:
    enable: true
    num_groups: 32
  validation:
    enable: true
    pecentage: 0.2


model:
  vit:
    emb_size: 32
    patch_size: 4
    num_layers: 4
    num_heads: 2

region:
  lon_min: -18
  lon_max: 0
  lat_min: 21
  lat_max: 36

dates:
  train:
    start: "1979-01-01"
    end: "1979-12-31"
  test:
    start: "1980-01-01"
    end: "1980-12-31"

paths:
  root_dir: "/home/hassan/All data/Internship/Code/DS_intern/Dataset/"
  results_dir: "results/"
  shapefile_path: "ma_shp/ma.shp"
  era5_predictor_pattern: "{var}_1979-2020_levels.nc"
  mswep_path: "mswep_1979_2020.nc"


