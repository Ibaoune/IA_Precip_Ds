general:
  verbose: true
  experiment: "vit_precip_exp17_batch16"
  variable: "precip"  
  target: "mswep"    
  src: "era5"        
  model_type: "vit" 
  interpolation_type: "linear" 
  variables: ["z", "q", "t", "u", "v"]
  levels: [500, 700, 850]
  resolution: 2.0

training:
  learning_rate: 2e-3
  epochs: 10
  batch_size: 16
  loss_type: "bernoulli_gamma" 
  norm_mode: "channel"         
  early_stopping:
    enable: true
    max: 15
  LR_scheduler:
    enable: true
    patience: 5
    factor: 0.5
    min_lr: 1e-6
  gradient_clipping:
    enable: true
    value: 1.0
  weight_decay:
    enable: true
    value: 1e-4
  optimizer: "adamw"
  dropout:
    enable: true
    value: 0.1
  scheduler: 
    enable: true
    type: "cosine"
  group_norm:
    enable: true
    num_groups: 32
  validation:
    enable: true
    pecentage: 0.2

model:
  vit:
    emb_size: 64
    patch_size: 4
    num_layers: 4
    num_heads: 4

region:
  lon_min: -18
  lon_max: 0
  lat_min: 21
  lat_max: 36

dates:
  train:
    start: "1979-01-01"
    end: "2005-12-31"
  test:
    start: "2006-01-01"
    end: "2020-12-31"

paths:
  root_dir: "/home/mohammad.elaabaribao/lustre/climat-um6p-st-iwri-7ksifkvwkuy/users/mohammad.elaabaribao/data/era5ztquv/1979_2020/all_data"
  results_dir: "/srv/data/mohammad.elaabaribao/work/papers/downscaling/main/results/"
  shapefile_path: "/home/mohammad.elaabaribao/lustre/climat-um6p-st-iwri-7ksifkvwkuy/users/mohammad.elaabaribao/data/shapefiles/Morocco_shpfile/DA_REGIONS_12R.shp"
  era5_predictor_pattern: "{var}_1979-2020_levels.nc"
  mswep_path: "mswep_1979_2020.nc"
